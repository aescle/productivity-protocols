name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the bank
        run: node scripts/validate.mjs
      - name: Check the generated mirror and site are in sync
        run: |
          node scripts/generate-index.mjs
          git diff --exit-code -- src/protocols.generated.js site/index.html
